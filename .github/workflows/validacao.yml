name: Validação do Projeto
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        - run: echo "Iniciando o Workflow"
        - name: Checkout
          uses: actions/checkout@v5
        - name: Exibindo Repositório
          run: echo ${{github.repository}}
        - name: Exibindo Usuário
          run: echo ${{github.actor}}
        - name: Verificando se README.md existe 
          run: |
            if [ -f "README.md"]; then
                echo "O arquivo README.md existe."
            else
                echo "Erro: O arquivo README.md não foi encontrado!"
                exit 1
            fi
        - name: Conclusão da Validação
          run: echo "Validação concluida para o README.md"